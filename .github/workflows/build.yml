name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild -project Listen1WebView.xcodeproj \
            -scheme Listen1WebView \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/Listen1WebView.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA (ad-hoc)
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
              <key>uploadSymbols</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Listen1WebView.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Rename IPA
        run: |
          cp $RUNNER_TEMP/build/Listen1WebView.ipa $RUNNER_TEMP/Listen1WebView_1.0.0.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Listen1WebView
          path: ${{ runner.temp }}/Listen1WebView_1.0.0.ipa
          retention-days: 7
