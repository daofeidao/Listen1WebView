name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  VERSION: "1.0.0"

jobs:
  build-ios:
    name: 编译 iOS 安装包
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 检查苹果编译环境
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 安装项目生成工具
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail
          xcodebuild \
            -project Listen1WebView.xcodeproj \
            -scheme Listen1WebView \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 IPA 安装包
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Listen1WebView.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.listen1.webview.Listen1WebView'
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/Listen1WebView.app
          /usr/bin/codesign --force --deep --sign - build/ipa/Payload/Listen1WebView.app
          cd build/ipa
          /usr/bin/zip -qry "../Listen1WebView-v$VERSION.ipa" Payload
          cd ../..
          test -s "build/Listen1WebView-v$VERSION.ipa"
          echo "IPA 安装包已生成："
          ls -lh "build/Listen1WebView-v$VERSION.ipa"
          /usr/bin/unzip -l "build/Listen1WebView-v$VERSION.ipa" | head -20

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Listen1WebView
          path: build/Listen1WebView-v${{ env.VERSION }}.ipa
          retention-days: 7
